# The competitive field.
#
# The goal of this repository is one unified engine that is the fastest thing
# in existence at caseless search -- single needle and multi needle, ASCII and
# UTF-8, in one construction rather than a family of special cases. This file
# lists what it has to beat.
#
# The field is a work list, not a ceiling. A tier with no entrant is missing
# work here; it is never a reason to discount a result or to narrow the goal,
# and the right response to "that tier has no competitor" is to put one in it.
#
# An entrant must declare the instruction set it dispatched to at runtime and
# refuse to race on a weaker path than the machine offers. A competitor
# quietly running a portable build is not a competitor, and a ratio measured
# against one says nothing: Vectorscan's AVX-512 support is a compile-time
# option that is off by default, so it is built from source here with the
# option on and its dispatch proven, and StringZilla's adapter queries
# sz_capabilities() and errors rather than let a serial fallback flatter this
# repository. Every bar row reports each entrant's dispatched width.
#
# semantic_status decides whether a baseline's time may enter x_vs_best on
# its native tier. A board_tier/board_semantic_status pair describes a
# BenchmarkBoard-only timed adaptation and does not widen other arena consumers.
#
#   exact          agrees with the arena oracle on its declared tier.
#                  Counts as a competitor.
#   exact-for-ascii  agrees on the ASCII tier only. Counts there, excluded
#                  from UTF-8 rows.
#   diagnostic     runs for reference but never enters x_vs_best, because its
#                  semantics differ (full folding vs simple folding, different
#                  match position, different tie rule). Any adaptation needed
#                  for equivalence is timed as part of the entrant it adapts.
#
# exact_tier lists the tiers where an entrant's native case-sensitive mode,
# its fold flag dropped (PCRE2 also drops PCRE2_UTF, for byte mode), answers
# the board's case-sensitive cells against the raw-byte oracle. An entrant
# without it has no exact mode and supports no case-sensitive cell.
#
# Reporting rule: state which entrants a row actually ran against, and report
# rows the candidate loses next to the ones it wins.
#
# This is the virtualized CPU profile that produced this field record. It is an
# observed CPUID identity, not a product-name or feature inference: each native
# adapter reports its actual per-row state and the candidate gates execution on
# runtime feature detection.
measurement_host:
  vendor: GenuineIntel
  family: 6
  model: 143
  benchmark_cpu: "Intel(R) Xeon(R) Platinum 8481C CPU @ 2.70GHz"
  lscpu_model_name: "unknown (KVM virtualized CPUID)"
  observed_features: [avx2, avx512f, avx512bw, avx512vbmi]
  observed_with: "Go benchmark header, lscpu, and golang.org/x/sys/cpu on the measurement process"

baselines:
  - name: regexp
    tier: [ascii, utf8]
    exact_tier: [ascii, utf8]
    semantic_status: exact
    what: Go stdlib regexp with (?i), scalar NFA. The floor, not the field.

  - name: veloz
    tier: [ascii]
    semantic_status: exact-for-ascii
    board_tier: [ascii, utf8]
    board_semantic_status: exact
    what: Native mhr3/veloz ascii.IndexFold remains an ASCII-byte fold, using
          hand-written AVX2 on this x86 field. BenchmarkBoard keeps its direct
          ASCII-singleton route and uses a timed minimum-orbit simple-fold view
          for other folded valid-UTF-8 cells, merging per-pattern searches and
          projecting source spans. This adapter does not widen Veloz's support
          in other arena consumers. Its SSE/scalar fallback is excluded rather
          than raced as the same entrant; it has no exact substring mode.

  - name: rust-aho-corasick
    tier: [ascii]
    exact_tier: [ascii, utf8]
    semantic_status: exact-for-ascii
    what: Direct pinned Rust aho-corasick 1.1.5 C ABI, DFA with ASCII case
          insensitivity, LeftmostFirst ordering, and enabled prefilter. A
          checked memchr source patch records the memchr backend reached by
          each query as a diagnostic. The entrant counts on every ASCII row
          whatever width it reports, since the audit cannot see its Teddy
          path (#29, #31). Original pattern IDs are retained.

  - name: aho-corasick
    tier: [ascii]
    semantic_status: diagnostic
    what: petar-dambovaliev/aho-corasick DFA. Retained as a supplemental
          non-winning Go multi-pattern control; its timing never establishes x_vs_best.

  - name: tolower
    tier: [ascii]
    semantic_status: diagnostic
    what: strings.ToLower + strings.Index. Not folding; wrong beyond ASCII.

  - name: stringzilla
    tier: [ascii, utf8]
    exact_tier: [ascii, utf8]
    semantic_status: exact
    what: StringZilla v5.1.2 caseless UTF-8 search with runtime-dispatched
          Ice Lake AVX-512 required. It is excluded before native calls when
          that path is unavailable, never silently downgraded. The arena
          compiles each literal once, verifies full-fold candidates with simple
          folding in the timed path, and reduces single-literal scans to
          leftmost/lowest-pattern results after fold-hazard and ordered-
          alternation checks against the oracle.

  - name: pcre2-jit
    tier: [ascii, utf8]
    exact_tier: [ascii, utf8]
    semantic_status: exact
    what: PCRE2 JIT with PCRE2_CASELESS|PCRE2_UTF. The arena compiles literals
          and ordered alternations once, requires JIT, and checks fold hazards
          and leftmost start against its oracle on every valid-UTF-8 row,
          including ASCII. Alternations have no capture groups, which slow
          PCRE2, so they report no pattern ID, as regexp does.

  - name: rure
    tier: [ascii, utf8]
    exact_tier: [ascii, utf8]
    semantic_status: exact
    what: rust-regex through the pinned rure C API with (?i) and Unicode mode.
          A checked source patch records the memchr backend reached by each
          query as a diagnostic. The entrant counts on every row whatever
          width it reports, since the audit cannot see its Teddy path (#29,
          #31). Literals and ordered alternations are compiled once and
          checked against the oracle. Alternations have no capture groups,
          which turn off rust-regex's literal-set fast path, so they report
          no pattern ID, as regexp does.

  - name: vectorscan
    tier: [ascii, utf8]
    exact_tier: [ascii, utf8]
    semantic_status: exact
    what: Source-built Vectorscan 5.4.12 fat runtime with AVX2, AVX-512, and
          AVX-512 VBMI targets enabled. Each database is explicitly compiled
          for the process's audited AVX-512-VBMI or AVX2 target and its
          hs_database_info feature string is checked before timing. The arena
          uses HS_FLAG_CASELESS|HS_FLAG_UTF8|HS_FLAG_SOM_LEFTMOST and times its
          all-match leftmost/lowest-pattern adapter after fold-hazard and
          ordered-alternation checks against the oracle.
